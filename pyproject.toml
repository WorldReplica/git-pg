[project]
name = "git-pg"
version = "0.1.0"
description = "Sandboxed agent git repos backed by Postgres with special-file table projections"
readme = "README.md"
authors = [
    { name = "thomasdecloedt", email = "thomas.decloedt@worldreplica.ai" },
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "typer>=0.27.1",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]

[project.scripts]
git-pg = "git_pg.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "git_pg"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["git_pg"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "alembic.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests requiring Postgres",
    "benchmark: performance benchmarks (set BENCHMARK=1)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["git_pg"]
branch = true
