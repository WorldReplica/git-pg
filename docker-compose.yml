services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitpg
      POSTGRES_PASSWORD: gitpg
      POSTGRES_DB: gitpg
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpg -d gitpg"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
