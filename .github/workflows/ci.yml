name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gitpg
          POSTGRES_PASSWORD: gitpg
          POSTGRES_DB: gitpg
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gitpg -d gitpg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GIT_PG_DATABASE_URL: postgresql+asyncpg://gitpg:gitpg@localhost:54329/gitpg
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Initialize Postgres schema
        run: |
          PGPASSWORD=gitpg psql -h localhost -p 54329 -U gitpg -d gitpg -f docker/init.sql
          cd apps/demo-web && uv run alembic -c alembic.ini upgrade head

      - name: Configure git identity
        run: |
          git config --global user.email "ci@git-pg.local"
          git config --global user.name "git-pg ci"

      - name: Ruff check
        run: uv run ruff check src tests apps/demo-web/api

      - name: Ruff format
        run: uv run ruff format --check src tests apps/demo-web/api

      - name: Mypy
        run: PYTHONPATH=apps/demo-web uv run mypy src apps/demo-web/api

      - name: Pytest
        run: PYTHONPATH=apps/demo-web uv run pytest tests -v -m "not benchmark"

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/demo-web/web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: apps/demo-web/web
        run: pnpm install --frozen-lockfile

      - name: Web lint
        working-directory: apps/demo-web/web
        run: pnpm lint

      - name: Web format
        working-directory: apps/demo-web/web
        run: pnpm fmt:check

      - name: Web typecheck
        working-directory: apps/demo-web/web
        run: pnpm typecheck

      - name: OpenAPI types drift check
        working-directory: apps/demo-web/web
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
